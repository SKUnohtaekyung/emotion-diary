<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" width="1920" height="760" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>HON — 지금 어디까지 왔나요</title>
  <rect width="1920" height="760" fill="#ffffff"/>
  <path d="M0 430 C 480 380, 1040 370, 1920 300 L1920 760 L0 760 Z" fill="#cfe8dc"/>

  <text x="120" y="96" font-size="26" font-weight="700" fill="#2e7d5b">지금 여기</text>
  <text x="120" y="176" font-size="68" font-weight="800" fill="#1f2a2c">지금 <tspan fill="#2e7d5b">어디까지</tspan> 왔나요.</text>
  <text x="120" y="226" font-size="26" fill="#55605f">2026년 11월 기준</text>

  <!-- 길 -->
  <path d="M120 560 C 420 500, 760 600, 1060 520 S 1620 430, 1800 440" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>

  <!-- 끝난 단계 -->
  <g fill="#0b2227">
    <circle cx="170" cy="549" r="15"/>
    <circle cx="400" cy="521" r="15"/>
    <circle cx="630" cy="536" r="15"/>
    <circle cx="860" cy="553" r="15"/>
    <circle cx="1070" cy="517" r="15"/>
  </g>
  <g font-size="27" font-weight="600" fill="#1f2a2c" text-anchor="middle">
    <text x="170" y="620">서비스 WHY</text>
    <text x="400" y="468">시장·경쟁 조사</text>
    <text x="400" y="434" font-size="21" font-weight="400" fill="#55605f">61개 서비스</text>
    <text x="630" y="606">194개 감정 체계</text>
    <text x="860" y="486">디자인 시스템</text>
    <text x="860" y="452" font-size="21" font-weight="400" fill="#55605f">친구 아홉</text>
    <text x="1070" y="588">전체 화면 시안</text>
  </g>

  <!-- 지금 -->
  <rect x="1150" y="356" width="380" height="64" rx="32" fill="#5dffb8"/>
  <text x="1340" y="398" font-size="28" font-weight="700" fill="#0b2227" text-anchor="middle">지금 · 앱 핵심 구현 완료</text>
  <ellipse cx="1340" cy="476" rx="54" ry="42" fill="#1d4a4f"/>
  <ellipse cx="1356" cy="488" rx="38" ry="28" fill="#8fbfb8"/>
  <text x="1340" y="566" font-size="21" fill="#1f2a2c" text-anchor="middle">로그인 · 저장 · 오늘 한 편</text>
  <text x="1340" y="596" font-size="21" fill="#1f2a2c" text-anchor="middle">내보내기 · 지우기 · 백업 복원</text>

  <!-- 다음 단계 -->
  <g fill="#ffffff" stroke="#6b7775" stroke-width="4">
    <circle cx="1530" cy="452" r="13"/>
    <circle cx="1670" cy="440" r="13"/>
    <circle cx="1800" cy="440" r="13"/>
  </g>
  <g font-size="22" fill="#55605f" text-anchor="middle">
    <text x="1530" y="504">시안 화면</text>
    <text x="1530" y="532">옮기기</text>
    <text x="1670" y="400">사용자 연구</text>
    <text x="1670" y="372" font-size="18">15~20명 · 4주</text>
    <text x="1800" y="492">돌아보기</text>
    <text x="1800" y="520">AI 근거 게이트</text>
  </g>

  <g font-size="20" fill="#55605f">
    <circle cx="128" cy="700" r="9" fill="#0b2227"/>
    <text x="148" y="707">끝난 것</text>
    <circle cx="268" cy="700" r="8" fill="#ffffff" stroke="#6b7775" stroke-width="3"/>
    <text x="288" y="707">다음에 할 것</text>
  </g>
</svg>
