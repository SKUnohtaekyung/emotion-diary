<svg xmlns="http://www.w3.org/2000/svg">
  <!-- 로딩 화면의 평면 조약돌(시안 전용, splash-lab.html). 오늘 화면 돌 그림(design/pebbles/ui/stone-rest-320.png)의 실루엣을 132×107로 따 단순하게 그렸다 —
       뒤 돌(전체 실루엣)과 앞 돌(콩 모양). 같은 틀이라 로딩이 끝날 때 진짜 돌 자리에 그대로 겹친다.
       색: #62FDB4 = tokens service.mint(앱 아이콘의 조약돌), #0B1228 = tokens forest.sky. CSS 변수가 오기 전에 그려져야 해서 여기에 둔다. -->
  <defs>
    <path id="pb-all" d="M130.4 55.8C131.1 59.7 131.2 64.0 130.2 67.9C129.3 71.7 127.0 75.4 124.8 78.7C122.5 81.9 119.4 84.7 116.6 87.4C113.9 90.1 111.3 92.7 108.4 94.8C105.5 96.9 102.2 98.6 99.1 100.1C96.0 101.5 92.8 102.7 89.6 103.7C86.5 104.6 83.3 105.5 80.2 105.8C77.0 106.2 73.8 105.8 70.8 105.8C67.8 105.8 64.9 105.9 62.0 105.7C59.1 105.6 56.2 105.3 53.3 105.0C50.4 104.6 47.4 104.3 44.6 103.5C41.8 102.7 39.1 101.4 36.4 100.1C33.7 98.8 31.0 97.4 28.6 95.6C26.1 93.9 23.6 92.0 21.5 89.8C19.4 87.6 17.6 85.0 15.9 82.4C14.2 79.8 12.7 77.1 11.2 74.3C9.7 71.5 8.1 68.6 6.7 65.6C5.4 62.5 3.9 59.2 3.0 55.8C2.0 52.4 1.2 48.7 1.0 45.1C0.9 41.4 1.3 37.7 1.9 33.9C2.5 30.2 3.3 26.3 4.8 22.8C6.3 19.3 8.3 15.7 10.8 12.9C13.3 10.0 16.5 7.5 19.8 5.6C23.1 3.7 26.9 2.3 30.6 1.5C34.3 0.8 38.4 0.7 42.1 1.2C45.8 1.6 49.6 2.9 52.9 4.2C56.2 5.6 59.3 7.4 62.0 9.2C64.7 11.0 67.0 13.2 69.1 15.2C71.2 17.2 72.9 19.5 74.5 21.3C76.2 23.1 77.0 25.4 79.1 26.2C81.2 26.9 84.0 25.9 87.2 25.8C90.3 25.7 94.4 25.1 98.0 25.6C101.6 26.1 105.3 27.2 108.8 28.8C112.3 30.4 116.0 32.5 119.0 35.1C121.9 37.7 124.6 41.0 126.6 44.4C128.5 47.9 129.8 51.9 130.4 55.8Z"/>
    <path id="pb-front" d="M15 79C17 68 22 59 30 52C38 45 47 39 57 34C67 29 79 25 92 24C104 23 116 27 124 35C131 42 133 53 132 63C131 74 127 83 120 90C112 97 102 102 90 104C78 106 64 106 52 105C41 104 31 100 24 94C18 89 14 85 15 79Z"/>
  </defs>
  <!-- ① 겹친 두 돌: 뒤 돌은 민트를 남색 위에 반쯤(어둡게), 앞 돌은 민트 -->
  <symbol id="s1" viewBox="0 0 132 107"><use href="#pb-all" fill="#62FDB4" fill-opacity=".45"/><use href="#pb-front" fill="#62FDB4"/></symbol>
  <!-- ② 한 돌: 앞 돌(콩 모양)만 -->
  <symbol id="s2" viewBox="0 0 132 107"><use href="#pb-front" fill="#62FDB4"/></symbol>
  <!-- ③ 한 색 두 돌: 한 색 실루엣에 앞 돌 둘레를 남색 틈으로 -->
  <symbol id="s3" viewBox="0 0 132 107"><use href="#pb-all" fill="#62FDB4"/><use href="#pb-front" fill="#62FDB4" stroke="#0B1228" stroke-width="4"/></symbol>
  <!-- ④ 한 돌 + 빛 한 줄: 앞 돌에 윗왼쪽 반짝임 -->
  <symbol id="s4" viewBox="0 0 132 107"><use href="#pb-front" fill="#62FDB4"/><path d="M46 52C56 42 70 36 86 34" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/></symbol>
</svg>
