<!doctype html>
<!-- 인라인 스크립트·인라인 스타일·style 속성을 두지 않는다 — CSP가 막는다. 모양은 CSS 파일, 동작은 /src/main.ts. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 숲 색(design/tokens.json color.forest.sky). manifest.webmanifest의 theme_color·background_color와 같아야 한다 — 시험이 대조한다. -->
    <meta name="theme-color" content="#0B1228" />
    <meta name="apple-mobile-web-app-title" content="감정일기" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>감정일기</title>
  </head>
  <body>
    <!-- 앱 시작 로딩 화면(D-134): 오늘 화면 숲 하늘과 같은 남색 위 평면 조약돌(오늘 화면 돌의 실루엣 — 뒤 돌·앞 돌)이 가만히 있다가, 2초가 넘으면 아래로 잔물결,
         10초가 넘으면 '다시 시도'. 준비되면 조약돌이 오늘 화면의 돌 자리로 내려앉는다. 300ms 안에 준비되면 보이지 않는다. 걷는 일은 src/ui/splash.ts.
         색은 CSS보다 먼저 그려지게 fill 속성에 둔다(#0B1228 = tokens forest.sky, #62FDB4 = tokens service.mint) — 시험이 토큰과 대조한다. 실루엣은 시안 web/splash-pebbles.svg의 s1과 같다. -->
    <div class="splash" id="splash">
      <div class="splash-veil" aria-hidden="true"></div>
      <div class="splash-center" aria-hidden="true">
        <svg class="splash-ripples" viewBox="0 0 140 40" aria-hidden="true" focusable="false"><ellipse cx="70" cy="20" rx="64" ry="16" fill="none" stroke="#62FDB4" stroke-width="2" /><ellipse cx="70" cy="20" rx="64" ry="16" fill="none" stroke="#62FDB4" stroke-width="2" /></svg>
        <svg class="splash-mark" viewBox="0 0 132 107" aria-hidden="true" focusable="false"><path class="pb-back" d="M130.4 55.8C131.1 59.7 131.2 64.0 130.2 67.9C129.3 71.7 127.0 75.4 124.8 78.7C122.5 81.9 119.4 84.7 116.6 87.4C113.9 90.1 111.3 92.7 108.4 94.8C105.5 96.9 102.2 98.6 99.1 100.1C96.0 101.5 92.8 102.7 89.6 103.7C86.5 104.6 83.3 105.5 80.2 105.8C77.0 106.2 73.8 105.8 70.8 105.8C67.8 105.8 64.9 105.9 62.0 105.7C59.1 105.6 56.2 105.3 53.3 105.0C50.4 104.6 47.4 104.3 44.6 103.5C41.8 102.7 39.1 101.4 36.4 100.1C33.7 98.8 31.0 97.4 28.6 95.6C26.1 93.9 23.6 92.0 21.5 89.8C19.4 87.6 17.6 85.0 15.9 82.4C14.2 79.8 12.7 77.1 11.2 74.3C9.7 71.5 8.1 68.6 6.7 65.6C5.4 62.5 3.9 59.2 3.0 55.8C2.0 52.4 1.2 48.7 1.0 45.1C0.9 41.4 1.3 37.7 1.9 33.9C2.5 30.2 3.3 26.3 4.8 22.8C6.3 19.3 8.3 15.7 10.8 12.9C13.3 10.0 16.5 7.5 19.8 5.6C23.1 3.7 26.9 2.3 30.6 1.5C34.3 0.8 38.4 0.7 42.1 1.2C45.8 1.6 49.6 2.9 52.9 4.2C56.2 5.6 59.3 7.4 62.0 9.2C64.7 11.0 67.0 13.2 69.1 15.2C71.2 17.2 72.9 19.5 74.5 21.3C76.2 23.1 77.0 25.4 79.1 26.2C81.2 26.9 84.0 25.9 87.2 25.8C90.3 25.7 94.4 25.1 98.0 25.6C101.6 26.1 105.3 27.2 108.8 28.8C112.3 30.4 116.0 32.5 119.0 35.1C121.9 37.7 124.6 41.0 126.6 44.4C128.5 47.9 129.8 51.9 130.4 55.8Z" fill="#62FDB4" fill-opacity=".45" /><path class="pb-front" d="M15 79C17 68 22 59 30 52C38 45 47 39 57 34C67 29 79 25 92 24C104 23 116 27 124 35C131 42 133 53 132 63C131 74 127 83 120 90C112 97 102 102 90 104C78 106 64 106 52 105C41 104 31 100 24 94C18 89 14 85 15 79Z" fill="#62FDB4" /></svg>
      </div>
      <div class="splash-slow" role="status"><p class="splash-wait">불러오는 중이에요</p><p class="splash-stuck">연결이 느린 것 같아요 <a href="/">다시 시도</a></p></div>
    </div>
    <div id="banner" role="status"></div>
    <main id="app" aria-busy="true">
      <p class="boot-note">불러오는 중…</p>
    </main>
    <!-- 하단 탐색(DESIGN_SYSTEM §6.11): 밝은 목록 화면(달력·통계·설정)에서만 ui/bottomNav.ts가 보인다. #app 밖이라 스크롤되지 않는다(D-125).
         아이콘 경로는 시안 web/index.html과 같다. 이름은 칸마다 숨은 글(nav-label)이다. -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="주요 화면" hidden>
      <div class="bottom-nav-rail">
        <span class="bottom-nav-indicator" aria-hidden="true"></span>
        <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic-fill" d="M12 3 3 10v11h6v-6h6v6h6V10z" /><path class="ic-line" d="M12 4 4 10.4V20h4.5v-6h7v6H20v-9.6z" /></svg><span class="nav-label">오늘</span></a>
        <a href="#/calendar" data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ic-fill" x="3" y="5" width="18" height="16" rx="2" /><rect class="ic-line" x="3.5" y="5.5" width="17" height="15" rx="2" /><path class="ic-cut" d="M3.5 10h17" /><path class="ic-stroke" d="M8 3.5v4M16 3.5v4" /><rect class="ic-mark" x="13.5" y="13.5" width="4" height="4" rx="1" /></svg><span class="nav-label">달력</span></a>
        <a href="#/stats" data-tab="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic-bars" d="M5 19V11M12 19V5M19 19v-5" /></svg><span class="nav-label">통계</span></a>
        <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ic-fill" cx="12" cy="12" r="3.8" /><circle class="ic-line" cx="12" cy="12" r="3.2" /><path class="ic-stroke" d="M12 3.5v2.6M12 17.9v2.6M20.5 12h-2.6M6.1 12H3.5M18 6l-1.8 1.8M7.8 16.2 6 18M18 18l-1.8-1.8M7.8 7.8 6 6" /></svg><span class="nav-label">설정</span></a>
      </div>
    </nav>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
