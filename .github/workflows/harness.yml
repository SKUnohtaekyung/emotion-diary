name: Repository harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # 두 OS에서 돌린다. Windows runner는 core.autocrlf=true라 .gitattributes의 원자료 보존
    # (references/source/** -text)이 실제로 지켜지는지, Linux runner는 LF checkout에서
    # 해시와 줄 단위 파서가 버티는지를 각각 확인한다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # check-characters.mjs가 sharp를 쓴다. lockfile 그대로 설치한다.
      - run: npm ci
      - run: node scripts/verify.mjs --mode quick
      - run: node scripts/verify.mjs --mode full

  e2e:
    # 실제 브라우저 E2E(TASK-SLICE-01 PLAN A-1): WebKit·Chromium으로 작성 흐름의 새로고침·연결 끊김 복원을 본다.
    # Ubuntu에서만 돈다 — Windows는 작업하는 PC에서 같은 명령으로 돈다(다시 열 조건: Windows에서만 깨지는 결함).
    # 로컬 비밀값과 시험용 열쇠는 이 실행 안에서 새로 만들고 실행이 끝나면 사라진다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell webkit chromium
      - run: node app/scripts/make-secrets.mjs local all
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
