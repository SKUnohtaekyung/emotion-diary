schema_version: "1.1"
source_of_truth: docs/EVAL_PLAN.md
label_definitions: docs/EVAL_PLAN.md §14
# 2026-09-02 G1(결함 I-10): node_gates 라벨을 EVAL §14 정의와 1:1로 재매핑하고
# severity medium을 EVAL §2/§11(차단·높음만 출시 차단)과 일치시켰다.
# 2026-10-15 TASK-CLEANUP-01(D-116·D-117): 관문을 '본인 사용 시작'(personal-start)과 '공개'(limited-release + public-only)로
# 나누고 새 순서의 관문 first-slice·data-control·personal-start를 더했다. 라벨 정의는 EVAL §14가 정본이다.

policies:
  no_skipped_required_gate: true
  no_test_weakening_without_decision: true
  retry_limit_transient: 2
  same_hypothesis_failure_limit: 2
  block_on_unknown_privacy_boundary: true
  one_writer_per_file: true
  # D-019. D-120 뒤에도 그대로다 — Max 요금제에 포함된 월 API 크레딧 안의 호출은 추가 지출 0이라 이 정책 안이고,
  # 따로 산 크레딧·자동 충전은 쓰지 않는다.
  no_paid_api_calls: true

gates:
  quick:
    blocking: true
    # quick이 실제로 하는 일(2026-09-20 TASK-INFRA-01에서 정의를 현실에 맞춤, 정본 AGENT_WORKFLOW §6):
    # 필수 파일·내부 링크·충돌 표식·비밀값·JSON 구문·원자료 SHA-256·PR/추적성/작업 그래프 구조에 더해
    # 데이터·자산 계약 검사 네 개(check-contrast, check-characters, check-taxonomy, check-harness)를 돈다.
    # check-characters가 sharp를 쓰므로 quick도 npm ci가 선행돼야 한다(로컬 약 2초).
    commands:
      - name: repository-document-check
        command: node scripts/verify.mjs --mode quick
        status: ready

  full:
    blocking: true
    commands:
      - name: repository-full-check
        command: node scripts/verify.mjs --mode full
        status: ready
      # 2026-10-14 app-scaffold(TASK-MOBILE T3, D-115 ⑥): 아래 넷은 verify full이 package.json의 같은 이름 script로 돈다.
      - name: lint
        command: npm run lint
        # Biome — 경고도 실패(--error-on-warnings). 일부러 넣은 미사용 변수를 잡는 것을 확인했다(tasks/mobile/2026-10-14-t3/PLAN.md 4-6).
        status: ready
      - name: typecheck
        command: npm run typecheck
        status: ready
      - name: unit-and-integration
        command: npm test
        # 검사기 자체 테스트(check-taxonomy, scope-guard, git-guard, check-characters, check-harness) 뒤에 vitest run —
        # 서버 시험(로컬 D1, EVAL F-22·F-23 등)과 화면 시험(happy-dom).
        status: ready
      - name: production-build
        command: npm run build
        # 개발용·운영용 두 벌을 묶고 운영 묶음에 개발용 전용 코드 표식이 0건인지 검사한다(D-115 ②).
        status: ready

  release:
    blocking: true
    commands:
      - name: browser-e2e
        # 2026-10-16 first-slice(D-123): Playwright Test 1.64.1, WebKit·Chromium, 로컬 https 서버(app/scripts/e2e-server.mjs).
        # 첫 쓰임은 first-slice 관문의 e2e-reload-restore다. 홈 화면 앱 모드·자판·앱 전환 화면은 대신하지 못한다 — mobile-slice.
        # CI는 .github/workflows/harness.yml의 Ubuntu e2e job이 돈다.
        command: npm run e2e
        status: ready
      - name: mobile-real-device
        # 공개 관문(D-117)의 실기기: 실제 앱으로 docs/EVAL_PLAN.md §4의 S-00~S-12 전부와 §6의 T-01~T-07을 iPhone 홈 화면 웹앱에서
        # 다시 본다(D-111). Android Chrome은 public-only에 있다. 본인 사용 시작 전에는 조각마다 해당 항목만 본다 —
        # first-slice의 mobile-slice, personal-start의 mobile-personal. 결과의 정본은 EVAL §4·§6 표다(D-118).
        command: manual evidence required
        status: pending
      - name: security-and-privacy
        command: manual plus automated evidence required
        status: pending
      - name: ai-evals
        command: null
        status: configure_after_evidence_baseline
      - name: deployment-boundary-review
        command: manual evidence required
        status: pending

severity_policy:
  # docs/EVAL_PLAN.md §2, §11: 차단/높음이 하나라도 열려 있으면 출시 불가. 중간은 출시를 막지 않지만
  # 릴리스 증거 묶음(§12 항목 9)에 owner와 함께 반드시 기록한다. 낮음은 Decision으로 수용 여부를 정한다.
  blocker:
    allowed_open: 0
  high:
    allowed_open: 0
  medium:
    allowed_open: listed in release evidence bundle with owner
  low:
    allowed_open: decision required

node_gates:
  bootstrap-facts:
    requires: [B-01, source-files-present, runtime-profile-complete, quick]
  security-foundation:
    requires: [B-02, B-03, B-08]
  data-contract:
    requires: [B-04, B-05]
  model-access:
    requires: [B-06]
  retrieval-contract:
    requires: [B-07]
  code-quality:
    requires: [reproducible-install, lint-configured, typecheck-configured, test-configured, build-configured, full]
  # 2026-10-15(D-116): 저장 핵심만. F-14·F-15는 data-control로 옮겼다. ci-green은 앱 코드가 CI에서 처음 도는 것을 확인한다.
  # F-17(하루 기준 시각 경계)은 2026-10-15 마감 검토 지적으로 더했다 — 저장된 entry_date는 나중에 고칠 수 없다.
  data-integrity:
    requires: [F-01, F-02, F-06, F-07, F-09, F-10, F-17, ci-green]
  first-slice:
    requires: [F-03, F-04, F-05, F-08, F-24, e2e-reload-restore, mobile-slice]
  data-control:
    requires: [F-14, F-15, restore-drill, export-cpu-measured]
  personal-start:
    requires: [full, F-01, F-02, F-06, F-07, F-09, F-10, F-14, F-15, F-17, F-24, deployment-boundary-review, backup-and-restore-drill, mobile-personal, crisis-help-unreviewed-label]
  source-fidelity:
    requires: [source-hashes-recorded, taxonomy-one-to-one-review, user-or-human-review]
  taxonomy-evidence:
    requires: [literature-axes-covered, falsification-table-complete, evidence-grade-recorded, license-check-passed, user-or-human-review]
  # 2026-10-15(D-117): 실기기는 iPhone만(mobile-core-flow-personal). Android와 화면 낭독기는 public-only로 옮겼다.
  core-product:
    requires: [F-03, F-04, F-05, F-07, F-08, F-17, F-18, F-19, F-21, mobile-core-flow-personal, accessibility-core-flow]
  journal-ai:
    requires: [ai-journal-fixed-set, no-fabrication, no-emotion-assertion, direct-entry-fallback, crisis-signal-100, history-forgery-0]
  reflection-core:
    requires: [F-11, F-12, F-13, F-20, deterministic-statistics, timezone-boundaries]
  evidence-quality:
    requires: [active-card-schema-valid, source-and-hash-valid, reviewer-approved, retrieval-baseline-frozen]
  ai-safety:
    requires: [citation-validity-100, citation-coverage-100, unsupported-claim-0, gate-false-pass-0, injection-success-0, observation-accuracy-100, crisis-flow-100]
  # 2026-10-15(D-117): 공개 관문 — 다른 사람에게 열기로 정할 때만 본다. public-only가 공개에만 필요한 것을 묶는다.
  limited-release:
    requires: [full, browser-e2e, mobile-real-device, security-and-privacy, deployment-boundary-review, blocker-0, high-0, ai-paths-disabled-or-verified, public-only]
  release:
    requires: [full, browser-e2e, mobile-real-device, security-and-privacy, ai-evals, deployment-boundary-review, blocker-0, high-0]
